! =====================================================================
! SAMPLE LAB CONFIGURATION - R1 (core-router)
! Fictional GNS3 lab values only. Not taken from any real device.
! Replace REPLACE_WITH_TEMP_LAB_PASSWORD / REPLACE_WITH_TEMP_ENABLE_SECRET
! with your own temporary lab values before pasting. Never commit them.
! Paste in global configuration mode (configure terminal).
! =====================================================================
hostname R1
!
enable secret REPLACE_WITH_TEMP_ENABLE_SECRET
username labuser privilege 15 secret REPLACE_WITH_TEMP_LAB_PASSWORD
!
ip domain-name lab.local
crypto key generate rsa modulus 2048
ip ssh version 2
!
no ip http server
no ip http secure-server
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description MGMT - to SW1 Gi0/0 (trunk, native VLAN 1)
 ip address 192.168.100.11 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description Link to R2 Gi0/1
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
!
line vty 0 4
 login local
 transport input ssh
!
end
