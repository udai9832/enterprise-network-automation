! =====================================================================
! SAMPLE LAB CONFIGURATION - SW1 (access-switch)
! Fictional GNS3 lab values only. Not taken from any real device.
! Replace REPLACE_WITH_TEMP_LAB_PASSWORD / REPLACE_WITH_TEMP_ENABLE_SECRET
! with your own temporary lab values before pasting. Never commit them.
! Paste in global configuration mode (configure terminal).
! =====================================================================
hostname SW1
!
enable secret REPLACE_WITH_TEMP_ENABLE_SECRET
username labuser privilege 15 secret REPLACE_WITH_TEMP_LAB_PASSWORD
!
ip domain-name lab.local
crypto key generate rsa modulus 2048
ip ssh version 2
!
no ip http server
no ip http secure-server
!
! Layer 2 switch: management only, R1 is the default gateway.
no ip routing
ip default-gateway 192.168.100.11
!
! Transparent mode keeps VLAN definitions in the running-config,
! so the "vlan 10" validation rule can see them.
vtp mode transparent
vlan 10
 name USERS
!
interface GigabitEthernet0/0
 description Uplink to R1 Gi0/0 (VLAN 1 untagged as native VLAN)
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface GigabitEthernet0/1
 description To R2 Gi0/0 (management)
 switchport mode access
 switchport access vlan 1
!
interface GigabitEthernet0/2
 description USERS access port (spare)
 switchport mode access
 switchport access vlan 10
!
interface GigabitEthernet0/3
 description To lab host adapter (GNS3 Cloud node)
 switchport mode access
 switchport access vlan 1
!
interface Vlan1
 description Management SVI
 ip address 192.168.100.21 255.255.255.0
 no shutdown
!
line vty 0 4
 login local
 transport input ssh
!
end
